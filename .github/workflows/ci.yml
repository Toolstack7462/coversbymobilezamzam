name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI verifies. It does NOT deploy. Releasing is a separate, explicitly
# authorised action - see docs/deployment.md and ADR 0010.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration and schema check
        run: npm run migrations:check

      - name: Locale parity
        run: npm run locales:check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (Workers runtime)
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run budgets

      - name: Secret scan
        run: npm run secret-scan

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare local database
        run: npm run db:migrate:local && npm run db:seed

      - name: Playwright
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
