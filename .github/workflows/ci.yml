name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI verifies. It does NOT deploy. Releasing is a separate, explicitly
# authorised action - see docs/deployment.md and ADR 0010.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration and schema check
        run: npm run migrations:check

      - name: Locale parity
        run: npm run locales:check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (Workers runtime)
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run budgets

      - name: Secret scan
        run: npm run secret-scan

  browser:
    name: Browser tests (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare local database
        run: npm run db:migrate:local && npm run db:seed

      - name: Playwright
        run: npx playwright test --project=${{ matrix.project }} --workers=1

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          retention-days: 7

  admin_visual:
    name: Admin visual review (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, updated]
    # Separate fixtures avoid shared Wrangler crashes and changing catalogue data.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision == 'baseline' && github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=visual
      - name: Upload admin visual evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: admin-visual-${{ matrix.revision }}
          path: test-results/admin-visual/*.png
          retention-days: 14

  storefront:
    name: Storefront visual review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # A separate runner/database keeps the catalogue stable for review screenshots.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=storefront
      - name: Upload storefront review evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: storefront-design-evidence
          path: |
            test-results/**/storefront-*.png
            test-results/**/test-failed-*.png
            test-results/**/video.webm
          retention-days: 14
